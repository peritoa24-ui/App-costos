<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mis Costos</title>
  <meta name="description" content="Registrá tus tickets de supermercado, validalos con los códigos de barra y proyectá tus gastos." />
  <meta name="theme-color" content="#2a78d6" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="vendor/chart.umd.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Resumen</h1>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-tab="dashboard" class="active"><span class="ico" aria-hidden="true">📊</span>Resumen</button>
    <button data-tab="ticket"><span class="ico" aria-hidden="true">🧾</span>Ticket</button>
    <button data-tab="consumo"><span class="ico" aria-hidden="true">🥫</span>Consumo</button>
    <button data-tab="productos"><span class="ico" aria-hidden="true">🏷️</span>Productos</button>
    <button data-tab="ajustes"><span class="ico" aria-hidden="true">⚙️</span>Ajustes</button>
  </nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-body" id="sheet-body"></div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
